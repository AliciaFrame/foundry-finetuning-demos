agent:
  name: zava-faos-agent

dataset_file: ./eval.jsonl

# FAOS evaluators are referenced by name; the optimization service resolves
# them against the Foundry agent-evaluator catalog:
#   https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
#
# spec.yaml uses a minimal known-good baseline. Add broader catalog evaluators
# such as task_completion, intent_resolution, tool_call_accuracy,
# tool_selection, tool_input_accuracy, and tool_output_utilization only after
# this baseline evaluates cleanly.
#
# task_navigation_efficiency (deterministic FSM check) needs an
# `expected_actions` field per task that FAOS does not currently forward —
# parked until FAOS exposes it.
evaluators:
  - task_adherence

options:
  eval_model: gpt-4.1-mini
  mode: evaluate           # baseline + candidate generation. Use `evaluate`
                           # to score the current agent only.
  strategies:
    - instruction
  budget: 10
  pass_threshold: 0.8      # Go yaml tag is snake_case. `passThreshold` is
                           # silently ignored by yaml.Unmarshal.
